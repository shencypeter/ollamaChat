name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AI_TeachingAssistant.sln

      - name: Build
        run: dotnet build AI_TeachingAssistant.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/AiTeachingAssistant.Tests/AiTeachingAssistant.Tests.csproj --configuration Release --no-build
